<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-26 -36 1422 992" width="1422" height="992"><style>
text{font-family:Helvetica, Arial, sans-serif;font-size:12px;fill:#111418;dominant-baseline:auto}
.d-mono{font-family:Menlo, Consolas, monospace;font-size:11px;fill:#2d343c}
.d-name{font-family:Helvetica, Arial, sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.04em}
.d-italic{font-style:italic}
.d-comp{font-size:10.5px;font-style:italic;fill:#5b6470}
.d-frame{fill:none;stroke:#111418;stroke-width:1}
.d-frame-tab{fill:#ffffff;stroke:#111418;stroke-width:1}
.d-sym .d-shape{fill:#f4f8fd;stroke:#111418}
.d-sym .d-rule,.d-sym .d-stick{stroke:#111418}
.d-sym.c-b .d-shape{fill:#fdf8ee;stroke:#111418}
.d-sym.c-b .d-rule,.d-sym.c-b .d-stick{stroke:#111418}
.d-sym.c-c .d-shape{fill:#fbf3f6;stroke:#111418}
.d-sym.c-c .d-rule,.d-sym.c-c .d-stick{stroke:#111418}
.d-sym.c-n .d-shape{fill:#fffbe6;stroke:#5b6470}
.d-sym.c-n .d-rule,.d-sym.c-n .d-stick{stroke:#5b6470}
.d-shape{stroke-width:1.2}
.d-shape.dashed{stroke-dasharray:6 4}
.d-rule{stroke-width:.8;opacity:.55;fill:none}
.d-stick{fill:none;stroke-width:1.5}
.d-port{fill:#ffffff;stroke:#111418;stroke-width:1.2}
.d-port-dir{fill:#111418;stroke:none}
.d-line{fill:none;stroke:#2d343c;stroke-width:1.2}
.d-line.dashed{stroke-dasharray:6 4}
.d-head{fill:none;stroke:#2d343c;stroke-width:1.2}
.d-head.filled{fill:#2d343c}
.d-head.hollow{fill:#ffffff}
.d-hit{fill:none;stroke:transparent;stroke-width:12}
.d-label-bg{fill:#ffffff;opacity:.85}
</style><rect x="-26" y="-36" width="1422" height="992" fill="#fff"/><rect class="d-frame" x="-10" y="-20" width="1390" height="960"/><path class="d-frame-tab" d="M-10 -20h206.2v14l-10 10H-10z"/><text class="d-mono" x="0" y="-4">req [package] Rules [Rules]</text><g class="d-symbols"><g class="d-sym c-b" data-sym="sy_065" transform="translate(40 40)"><rect class="d-shape" width="304" height="104"/><text class="d-mono" x="152" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="152" y="36" text-anchor="middle">Summary dates are computed</text><path class="d-rule" d="M0 46H304"/><text x="10" y="64">id = &quot;PP1&quot;</text><text x="10" y="80">text = &quot;A summary task’s dates shall never be</text><text x="10" y="96">stored, only computed from its subtasks.&quot;</text></g><g class="d-sym c-b" data-sym="sy_066" transform="translate(370 40)"><rect class="d-shape" width="300" height="120"/><text class="d-mono" x="150" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="150" y="36" text-anchor="middle">Nothing scheduled is cached</text><path class="d-rule" d="M0 46H300"/><text x="10" y="64">id = &quot;PP2&quot;</text><text x="10" y="80">text = &quot;Early and late dates, slack, work and</text><text x="10" y="96">cost shall be recomputed on every edit;</text><text x="10" y="112">nothing is cached in the file.&quot;</text></g><g class="d-sym c-b" data-sym="sy_067" transform="translate(700 40)"><rect class="d-shape" width="300" height="152"/><text class="d-mono" x="150" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="150" y="36" text-anchor="middle">A Flow operation applies once</text><path class="d-rule" d="M0 46H300"/><text x="10" y="64">id = &quot;PP3&quot;</text><text x="10" y="80">text = &quot;Each operation shall be applied once</text><text x="10" y="96">per plan (appliedOps, 90 days); one for a</text><text x="10" y="112">missing task is skipped and recorded; an</text><text x="10" y="128">unknown kind is left for a version that knows</text><text x="10" y="144">it.&quot;</text></g><g class="d-sym c-b" data-sym="sy_068" transform="translate(1030 40)"><rect class="d-shape" width="300" height="120"/><text class="d-mono" x="150" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="150" y="36" text-anchor="middle">Flow never rewrites a plan</text><path class="d-rule" d="M0 46H300"/><text x="10" y="64">id = &quot;PP4&quot;</text><text x="10" y="80">text = &quot;Flow shall only add a task or a</text><text x="10" y="96">timesheet line, never replace what is on</text><text x="10" y="112">screen.&quot;</text></g><g class="d-sym " data-sym="sy_069" transform="translate(210 330)"><rect class="d-shape" width="200" height="50"/><text class="d-mono" x="100" y="19" text-anchor="middle">«block»</text><text class="d-name" x="100" y="36" text-anchor="middle">Scheduler</text></g><g class="d-sym " data-sym="sy_070" transform="translate(870 330)"><rect class="d-shape" width="200" height="50"/><text class="d-mono" x="100" y="19" text-anchor="middle">«block»</text><text class="d-name" x="100" y="36" text-anchor="middle">Flow operations</text></g><g class="d-sym c-b" data-sym="sy_071" transform="translate(40 560)"><rect class="d-shape" width="304" height="120"/><text class="d-mono" x="152" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="152" y="36" text-anchor="middle">Backups keep tombstones</text><path class="d-rule" d="M0 46H304"/><text x="10" y="64">id = &quot;PP5&quot;</text><text x="10" y="80">text = &quot;Export everything shall include</text><text x="10" y="96">tombstones; Import everything shall merge by</text><text x="10" y="112">newer updatedAt and never delete.&quot;</text></g><g class="d-sym c-b" data-sym="sy_072" transform="translate(370 560)"><rect class="d-shape" width="300" height="120"/><text class="d-mono" x="150" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="150" y="36" text-anchor="middle">A profile is a summary</text><path class="d-rule" d="M0 46H300"/><text x="10" y="64">id = &quot;PP6&quot;</text><text x="10" y="80">text = &quot;Only Profiler’s stable fields shall be</text><text x="10" y="96">read; detail and raw answers are never copied</text><text x="10" y="112">into a plan.&quot;</text></g><g class="d-sym c-b" data-sym="sy_073" transform="translate(700 560)"><rect class="d-shape" width="304" height="104"/><text class="d-mono" x="152" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="152" y="36" text-anchor="middle">Workspaces stay apart</text><path class="d-rule" d="M0 46H304"/><text x="10" y="64">id = &quot;PP7&quot;</text><text x="10" y="80">text = &quot;Every screen shall count only the plans</text><text x="10" y="96">in the workspace in front.&quot;</text></g><g class="d-sym " data-sym="sy_074" transform="translate(40 840)"><rect class="d-shape" width="200" height="50"/><text class="d-mono" x="100" y="19" text-anchor="middle">«block»</text><text class="d-name" x="100" y="36" text-anchor="middle">Native format</text></g><g class="d-sym " data-sym="sy_075" transform="translate(370 840)"><rect class="d-shape" width="200" height="50"/><text class="d-mono" x="100" y="19" text-anchor="middle">«block»</text><text class="d-name" x="100" y="36" text-anchor="middle">Profile reader</text></g><g class="d-sym " data-sym="sy_076" transform="translate(700 840)"><rect class="d-shape" width="200" height="50"/><text class="d-mono" x="100" y="19" text-anchor="middle">«block»</text><text class="d-name" x="100" y="36" text-anchor="middle">Store</text></g></g><g class="d-paths"><g class="d-path" data-path="pa_066"><path class="d-hit" d="M277 330L277 237L192 237L192 144"/><path class="d-line dashed" d="M277 330L277 237L192 237L192 144"/><path class="d-head" transform="translate(192 144) rotate(-90)" d="M-11 -5L0 0L-11 5"/><rect class="d-label-bg" x="283" y="276.5" width="67.4" height="15"/><text class="d-mono" x="316.7" y="287.5" text-anchor="middle">«satisfy»</text></g><g class="d-path" data-path="pa_067"><path class="d-hit" d="M343 330L343 245L520 245L520 160"/><path class="d-line dashed" d="M343 330L343 245L520 245L520 160"/><path class="d-head" transform="translate(520 160) rotate(-90)" d="M-11 -5L0 0L-11 5"/><rect class="d-label-bg" x="397.8" y="227" width="67.4" height="15"/><text class="d-mono" x="431.5" y="238" text-anchor="middle">«satisfy»</text></g><g class="d-path" data-path="pa_068"><path class="d-hit" d="M937 330L937 261L850 261L850 192"/><path class="d-line dashed" d="M937 330L937 261L850 261L850 192"/><path class="d-head" transform="translate(850 192) rotate(-90)" d="M-11 -5L0 0L-11 5"/><rect class="d-label-bg" x="859.8" y="243" width="67.4" height="15"/><text class="d-mono" x="893.5" y="254" text-anchor="middle">«satisfy»</text></g><g class="d-path" data-path="pa_069"><path class="d-hit" d="M1003 330L1003 245L1180 245L1180 160"/><path class="d-line dashed" d="M1003 330L1003 245L1180 245L1180 160"/><path class="d-head" transform="translate(1180 160) rotate(-90)" d="M-11 -5L0 0L-11 5"/><rect class="d-label-bg" x="1057.8" y="227" width="67.4" height="15"/><text class="d-mono" x="1091.5" y="238" text-anchor="middle">«satisfy»</text></g><g class="d-path" data-path="pa_070"><path class="d-hit" d="M140 840L140 760L192 760L192 680"/><path class="d-line dashed" d="M140 840L140 760L192 760L192 680"/><path class="d-head" transform="translate(192 680) rotate(-90)" d="M-11 -5L0 0L-11 5"/><rect class="d-label-bg" x="146" y="793" width="67.4" height="15"/><text class="d-mono" x="179.7" y="804" text-anchor="middle">«satisfy»</text></g><g class="d-path" data-path="pa_071"><path class="d-hit" d="M470 840L470 760L520 760L520 680"/><path class="d-line dashed" d="M470 840L470 760L520 760L520 680"/><path class="d-head" transform="translate(520 680) rotate(-90)" d="M-11 -5L0 0L-11 5"/><rect class="d-label-bg" x="476" y="793" width="67.4" height="15"/><text class="d-mono" x="509.7" y="804" text-anchor="middle">«satisfy»</text></g><g class="d-path" data-path="pa_072"><path class="d-hit" d="M800 840L800 752L852 752L852 664"/><path class="d-line dashed" d="M800 840L800 752L852 752L852 664"/><path class="d-head" transform="translate(852 664) rotate(-90)" d="M-11 -5L0 0L-11 5"/><rect class="d-label-bg" x="806" y="789" width="67.4" height="15"/><text class="d-mono" x="839.7" y="800" text-anchor="middle">«satisfy»</text></g></g><g class="d-ports"></g></svg>
